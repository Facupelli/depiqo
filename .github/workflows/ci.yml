name: CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed applications
        id: changes
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          predicate-quantifier: some-with-excludes
          filters: |
            shared:
              - '**'
              - '!apps/backend/**'
              - '!apps/backoffice/**'
              - '!apps/storefront/**'

            backend:
              - 'apps/backend/**'

            backoffice:
              - 'apps/backoffice/**'

            storefront:
              - 'apps/storefront/**'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the comment ratchet
        env:
          COMMENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node --test scripts/comment-lint.test.mjs
          pnpm run lint:comments
          pnpm run lint:comments:baseline check "$COMMENT_BASE"

      # Backend
      - name: Generate Prisma client
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.shared == 'true'
        run: pnpm --filter @repo/backend run prisma:generate

      - name: Backend lint
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.shared == 'true'
        run: pnpm --filter @repo/backend run lint

      - name: Backend formatting
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.shared == 'true'
        run: pnpm --filter @repo/backend run format:check

      - name: Backend build
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.shared == 'true'
        run: pnpm turbo run build --filter=@repo/backend

      - name: Backend unit tests
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.shared == 'true'
        run: pnpm --filter @repo/backend run test

      - name: Backend database tests
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.shared == 'true'
        run: pnpm --filter @repo/backend run test:db:ci

      # Backoffice
      - name: Backoffice build
        if: steps.changes.outputs.backoffice == 'true' || steps.changes.outputs.shared == 'true'
        run: pnpm turbo run build --filter=@repo/backoffice

      - name: Backoffice lint
        if: steps.changes.outputs.backoffice == 'true' || steps.changes.outputs.shared == 'true'
        run: pnpm --filter @repo/backoffice exec biome lint

      - name: Backoffice typecheck
        if: steps.changes.outputs.backoffice == 'true' || steps.changes.outputs.shared == 'true'
        run: pnpm --filter @repo/backoffice run typecheck

      # Storefront
      - name: Storefront build
        if: steps.changes.outputs.storefront == 'true' || steps.changes.outputs.shared == 'true'
        run: pnpm turbo run build --filter=@repo/storefront

      - name: Storefront lint
        if: steps.changes.outputs.storefront == 'true' || steps.changes.outputs.shared == 'true'
        run: pnpm --filter @repo/storefront run lint

      - name: Storefront typecheck
        if: steps.changes.outputs.storefront == 'true' || steps.changes.outputs.shared == 'true'
        run: pnpm --filter @repo/storefront run typecheck
