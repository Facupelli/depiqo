services:
  postgres:
    image: postgres:18
    container_name: depiqo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: depiqo_dev
    ports:
      - "5432:5432"
    volumes:
      - depiqo_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d depiqo_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  depiqo_postgres_data:
